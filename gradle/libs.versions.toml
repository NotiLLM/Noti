[versions]
# Plugin versions
android-gradle = "8.9.2"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
secrets-gradle-plugin = "2.0.1"

# AndroidX versions
core-ktx = "1.16.0"
lifecycle-runtime-ktx = "2.9.0"
activity-compose = "1.10.1"
compose-bom = "2025.05.00"
constraintlayout = "2.2.1"

# Compose versions
compose = "1.8.1"
material3 = "1.3.2"

# Testing versions
junit = "4.13.2"
androidx-junit = "1.2.1"
espresso-core = "3.6.1"

# Room versions
room = "2.7.1"

# Paging versions
paging = "3.3.6"

# OpenAI / Networking
ktor = "2.3.11"
retrofit = "2.9.0"
okhttp = "4.11.0"

# Miscellaneous
dotenv = "6.4.1"
opencc = "1.2.0"
navigation = "2.9.0"
lazycolumn-scrollbar = "2.0.7"
gson = "2.11.0"
constraintlayout-compose = "1.1.1"
work-runtime = "2.10.1"

[libraries]
# AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayout-compose" }

# Compose
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

# Paging
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# OpenAI / Networking
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Miscellaneous
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
opencc = { module = "com.github.qichuan:android-opencc", version.ref = "opencc" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lazycolumn-scrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "lazycolumn-scrollbar" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "android-gradle" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin"}
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
secretsGradlePlugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }