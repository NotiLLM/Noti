[versions]
# Plugin versions
android-gradle = "8.13.2"
kotlin = "2.3.10"
ksp = "2.2.20-2.0.4"
secrets-gradle-plugin = "2.0.1"

# AndroidX versions
core-ktx = "1.17.0"
lifecycle-runtime-ktx = "2.9.4"
activity-compose = "1.11.0"
compose-bom = "2025.10.00"
constraintlayout = "2.2.1"

# Compose versions
compose = "1.9.3"
material3 = "1.4.0"
reorderable = "3.0.0"
compose-material-icons-core = "1.7.3"

# Testing versions
junit = "4.13.2"
androidx-junit = "1.3.0"
espresso-core = "3.7.0"

# Room versions
room = "2.8.2"

# Paging versions
paging = "3.4.1"

# OpenAI / Networking
ktor = "3.3.3"
retrofit = "3.0.0"
okhttp = "5.3.2"

# Miscellaneous
dotenv = "6.5.1"
navigation = "2.9.5"
lazycolumn-scrollbar = "2.0.7"
gson = "2.13.2"
constraintlayout-compose = "1.1.1"
work-runtime = "2.10.5"

kotlin-toon = "1.0.0"

googleServices = "4.4.4"
firebaseBom = "34.10.0"
playServicesAuth = "21.5.1"
googleApiClient = "2.9.0"
googleApiServicesTasks = "v1-rev20251102-2.0.0"
grpc = "1.79.0"

[libraries]
# AndroidX
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayout-compose" }

# Compose
compose-ui = { module = "androidx.compose.ui:ui" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons-core" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

# Paging
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# OpenAI / Networking
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Miscellaneous
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lazycolumn-scrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "lazycolumn-scrollbar" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime" }

# --- Testing (additional) ---
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }

kotlin-toon = { group = "br.com.vexpera", name = "kotlin-toon", version.ref = "kotlin-toon" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }

# Google Play Services & Tasks API
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
google-api-client-android = { module = "com.google.api-client:google-api-client-android", version.ref = "googleApiClient" }
google-api-services-tasks = { module = "com.google.apis:google-api-services-tasks", version.ref = "googleApiServicesTasks" }

grpc-android = { group = "io.grpc", name = "grpc-android", version.ref = "grpc" }
grpc-protobuf-lite = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpc" }
grpc-okhttp = { group = "io.grpc", name = "grpc-okhttp", version.ref = "grpc" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "android-gradle" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin"}
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
secretsGradlePlugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }